[package]
name = "ssbh_lib"
version = "0.19.0"
authors = ["ScanMountGoat <>"]
description = "Reading and writing SSBH file formats in Rust"
license = "MIT"
documentation = "https://docs.rs/ssbh_lib"
repository = "https://github.com/ultimate-research/ssbh_lib"
edition = "2024"

[dependencies]
ssbh_write = { path = "../ssbh_write", version = "^0.19" }
binrw.workspace = true
bilge.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
arbitrary = { workspace = true, optional = true, features = ["derive"] }
serde_bytes = { version = "0.11.5", optional = true }
hex = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"], optional = true }
glam.workspace = true

[dev-dependencies]
hex.workspace = true
hexlit.workspace = true

[features]
serde = ["dep:serde", "serde_bytes"]
serde_hex = ["serde", "hex"]
